name: Render Solar Size-Split Charts

on:
  workflow_dispatch:
    inputs:
      force_render:
        description: 'Render even if this ISO week already has a chart'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '30 14 * * 1'
  workflow_run:
    workflows: ['Daily NZ Grid Data Refresh']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: solar-size-split-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Check Weekly Render Gate
        id: due
        shell: bash
        run: |
          current_week="$(date -u +%G-W%V)"
          force="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_render }}" = "true" ]; then
            force="true"
          fi

          if [ "$force" = "true" ] || [ ! -f data/metadata/solar_size_split_chart_state.json ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last_week="$(python - <<'PY'
import json
from pathlib import Path
p = Path('data/metadata/solar_size_split_chart_state.json')
print(json.loads(p.read_text()).get('last_render_iso_week', ''))
PY
)"

          if [ "$last_week" = "$current_week" ]; then
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Solar size-split charts already rendered in $current_week; skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.due.outputs.due == 'true'
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Install Chart Dependencies
        if: steps.due.outputs.due == 'true'
        run: pip install matplotlib scipy numpy

      - name: Render Solar Size-Split Charts
        if: steps.due.outputs.due == 'true'
        run: python build_solar_size_split_charts.py --force

      - name: Commit Charts and Monthly Archive
        if: steps.due.outputs.due == 'true'
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/visuals/distributed_solar_size_split_capacity.png \
                  data/visuals/distributed_solar_size_split_installs.png \
                  data/visuals/distributed_solar_size_split_plot_data.csv \
                  data/visuals/archive/distributed_solar_size_split/ \
                  data/metadata/solar_size_split_chart_state.json
          if git diff --cached --quiet; then
            echo "No chart changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Render weekly solar size-split charts"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
