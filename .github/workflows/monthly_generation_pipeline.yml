name: Monthly Generation Pipeline Chart

on:
  schedule:
    - cron: '0 15 1 * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/monthly_generation_pipeline_trigger.txt'
      - '.github/workflows/monthly_generation_pipeline.yml'
      - 'check_ea_generation_pipeline.py'
      - 'build_distributed_solar_20pct.py'
      - 'build_generation_pipeline_status_metrics.py'
      - 'build_generation_pipeline_monthly_chart.py'
      - 'build_generation_pipeline_capacity_chart.py'
      - 'data/pipeline/ea_generation_investment_pipeline_current.csv'

permissions:
  contents: write

concurrency:
  group: monthly-generation-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests openpyxl pandas numpy scipy matplotlib

      - name: Check latest Transpower connection pipeline
        run: python update_connection_pipeline.py

      - name: Check EA generation investment pipeline source
        run: python check_ea_generation_pipeline.py

      - name: Refresh current EA snapshot archive copy
        shell: bash
        run: |
          snapshot_month=$(python - <<'PY'
          import csv
          with open('data/pipeline/ea_generation_investment_pipeline_current.csv', newline='', encoding='utf-8') as f:
              print(next(csv.DictReader(f))['snapshot_month'])
          PY
          )
          mkdir -p data/pipeline/history
          cp data/pipeline/ea_generation_investment_pipeline_current.csv "data/pipeline/history/ea_generation_investment_pipeline_${snapshot_month}.csv"

      - name: Build empirical pipeline status history
        run: python build_generation_pipeline_status_metrics.py

      - name: Build 20 percent household solar scenario
        run: python build_distributed_solar_20pct.py

      - name: Render monthly generation pipeline charts
        run: |
          python build_generation_pipeline_monthly_chart.py
          python build_generation_pipeline_capacity_chart.py

      - name: Validate rendered outputs
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import struct
          from pathlib import Path

          def validate_png(path: Path) -> tuple[int, int, int]:
              if not path.exists():
                  raise RuntimeError(f'Missing rendered PNG: {path}')
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise RuntimeError(f'Rendered output is not a valid PNG: {path}')
              if len(data) < 50_000:
                  raise RuntimeError(
                      f'Rendered PNG is unexpectedly small ({len(data):,} bytes): {path}'
                  )
              width, height = struct.unpack('>II', data[16:24])
              if width < 1200 or height < 1200:
                  raise RuntimeError(
                      f'Rendered PNG dimensions are unexpectedly small ({width}x{height}): {path}'
                  )
              return width, height, len(data)

          energy_png = Path('data/visuals/generation_pipeline_monthly_latest.png')
          energy_csv = Path('data/visuals/generation_pipeline_monthly_plot_data.csv')
          capacity_png = Path('data/visuals/generation_pipeline_capacity_monthly_latest.png')
          capacity_csv = Path('data/visuals/generation_pipeline_capacity_monthly_plot_data.csv')
          capacity_manifest_path = Path('data/visuals/generation_pipeline_capacity_monthly_manifest.json')
          status_meta_path = Path('data/metadata/ea_generation_pipeline_status_metrics.json')
          status_history_path = Path('data/pipeline/ea_generation_pipeline_status_history.csv')
          status_transitions_path = Path('data/pipeline/ea_generation_pipeline_status_transitions.csv')

          energy_dims = validate_png(energy_png)
          capacity_dims = validate_png(capacity_png)

          if not energy_csv.exists():
              raise RuntimeError(f'Missing plot-data CSV: {energy_csv}')
          with energy_csv.open(newline='', encoding='utf-8') as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              fields = set(reader.fieldnames or [])
          required = {
              'year',
              'baseline_twh',
              'full_pipeline_top_twh',
              'committed_utility_solar_twh',
              'actively_pursued_utility_solar_twh',
              'unknown_date_utility_solar_twh',
          }
          missing = sorted(required - fields)
          if missing:
              raise RuntimeError(
                  'Energy plot-data CSV does not match the current renderer; missing columns: '
                  + ', '.join(missing)
              )
          if len(rows) != 15 or rows[0]['year'] != '2026' or rows[-1]['year'] != '2040':
              raise RuntimeError(
                  f'Unexpected energy plot-data horizon: {len(rows)} rows, '
                  f"{rows[0]['year'] if rows else 'none'} to {rows[-1]['year'] if rows else 'none'}"
              )

          if not capacity_csv.exists():
              raise RuntimeError(f'Missing capacity plot-data CSV: {capacity_csv}')
          with capacity_csv.open(newline='', encoding='utf-8') as handle:
              cap_reader = csv.DictReader(handle)
              cap_rows = list(cap_reader)
              cap_fields = set(cap_reader.fieldnames or [])
          cap_required = {
              'year',
              'household_solar_incremental_mw',
              'generation_pipeline_total_mw',
              'generation_plus_household_total_mw',
              'storage_power_total_mw',
              'combined_generation_and_storage_power_mw',
              'committed_utility_solar_known_date_mw',
              'other_early-stage_bess_unknown_date_mw',
          }
          cap_missing = sorted(cap_required - cap_fields)
          if cap_missing:
              raise RuntimeError(
                  'Capacity plot-data CSV does not match the current renderer; missing columns: '
                  + ', '.join(cap_missing)
              )
          if len(cap_rows) != 15 or cap_rows[0]['year'] != '2026' or cap_rows[-1]['year'] != '2040':
              raise RuntimeError(
                  f'Unexpected capacity plot-data horizon: {len(cap_rows)} rows, '
                  f"{cap_rows[0]['year'] if cap_rows else 'none'} to {cap_rows[-1]['year'] if cap_rows else 'none'}"
              )

          if not status_meta_path.exists():
              raise RuntimeError(f'Missing status metrics JSON: {status_meta_path}')
          status_meta = json.loads(status_meta_path.read_text(encoding='utf-8'))
          if int(status_meta.get('snapshot_count', 0)) < 1:
              raise RuntimeError('Status tracker contains no monthly snapshots')
          if not status_history_path.exists():
              raise RuntimeError(f'Missing status history CSV: {status_history_path}')
          if not status_transitions_path.exists():
              raise RuntimeError(f'Missing status transition CSV: {status_transitions_path}')

          energy_manifest = json.loads(
              Path('data/visuals/generation_pipeline_monthly_manifest.json').read_text(encoding='utf-8')
          )
          capacity_manifest = json.loads(capacity_manifest_path.read_text(encoding='utf-8'))
          latest_month = status_meta.get('latest_snapshot_month')
          if latest_month != energy_manifest.get('snapshot_month'):
              raise RuntimeError(
                  'Status tracker latest month does not match energy render: '
                  f"{latest_month} vs {energy_manifest.get('snapshot_month')}"
              )
          if latest_month != capacity_manifest.get('snapshot_month'):
              raise RuntimeError(
                  'Status tracker latest month does not match capacity render: '
                  f"{latest_month} vs {capacity_manifest.get('snapshot_month')}"
              )

          print(
              f'Validated {energy_png}: {energy_dims[0]}x{energy_dims[1]}, '
              f'{energy_dims[2]:,} bytes'
          )
          print(
              f'Validated {capacity_png}: {capacity_dims[0]}x{capacity_dims[1]}, '
              f'{capacity_dims[2]:,} bytes'
          )
          print(f'Validated energy CSV: {len(rows)} annual rows, {len(fields)} columns')
          print(f'Validated capacity CSV: {len(cap_rows)} annual rows, {len(cap_fields)} columns')
          print(
              'Validated empirical status tracker: '
              f"{status_meta['snapshot_count']} snapshot(s), mode="
              f"{status_meta['empirical_conversion']['mode']}"
          )
          PY

      - name: Report source freshness
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          meta = json.loads(Path('data/metadata/ea_generation_pipeline_source.json').read_text())
          status_meta = json.loads(
              Path('data/metadata/ea_generation_pipeline_status_metrics.json').read_text()
          )
          capacity_manifest = json.loads(
              Path('data/visuals/generation_pipeline_capacity_monthly_manifest.json').read_text()
          )
          snap = meta['retained_snapshot']
          tp = meta.get('transpower_connection_pipeline_cross_check', {})
          check = meta.get('dashboard_check', {})
          empirical = status_meta.get('empirical_conversion', {})

          print('## Monthly generation pipeline source check')
          print()
          if check.get('ok'):
              print(
                  f"- EA dashboard checked successfully: {meta['checked_at_utc']} "
                  f"(HTTP {check.get('http_status', 'unknown')})"
              )
          else:
              print(f"- EA dashboard check failed from this runner: {meta['checked_at_utc']}")
              print(f"- EA check error: {check.get('error', 'unknown')}")
              print('- Render continued from the explicitly retained EA status snapshot; no fresh EA status was inferred.')
          print(f"- Retained EA status snapshot: {snap['snapshot_month']} captured {snap['captured_date']}")
          changed = meta.get('dashboard_changed_since_previous_check')
          if changed is None:
              print('- EA dashboard fingerprint change: unknown because the dashboard check failed')
          else:
              print(f"- EA dashboard fingerprint changed since prior successful check: {changed}")
          print(f"- Transpower connection-pipeline last modified: {tp.get('last_modified', 'unknown')}")
          print(
              f"- Capacity chart includes {capacity_manifest.get('past_due_pipeline_mw_included_from_start_year', 0):,.0f} MW "
              'with stated commissioning dates before the display start year, because those rows remain in the current EA pipeline snapshot.'
          )
          print()
          print('### Empirical EA status tracking')
          print()
          print(
              f"- Archive: {status_meta['snapshot_count']} snapshot(s), "
              f"{status_meta['first_snapshot_month']} to {status_meta['latest_snapshot_month']}"
          )
          print(f"- Tracking mode: {empirical.get('mode', 'unknown')}")
          if empirical.get('display_ready'):
              print(f"- Exact conversion measure ready: {empirical.get('display_label')}")
          elif empirical.get('annotation_ready'):
              print(f"- Aggregate status-flow annotation ready: {empirical.get('annotation_label')}")
          else:
              print('- Conversion measure not mature enough to display yet; monthly history will continue accumulating.')
          print()
          print(
              'Transpower is used as a freshness/cross-check stream only; '
              'its connection stages are not substituted for EA investment-pipeline statuses.'
          )
          if changed:
              print()
              print(
                  '**Review recommended:** the EA dashboard fingerprint changed. '
                  'Refresh the retained EA status snapshot if the underlying pipeline table changed.'
              )
          PY

      - name: Commit monthly snapshot and charts
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pipeline \
                  data/metadata/ea_generation_pipeline_source.json \
                  data/metadata/connection_pipeline_source.json \
                  data/metadata/ea_generation_pipeline_status_metrics.json \
                  data/distributed_generation/model/distributed_solar_adoption_20pct.* \
                  data/visuals/generation_pipeline_monthly_latest.png \
                  data/visuals/generation_pipeline_monthly_plot_data.csv \
                  data/visuals/generation_pipeline_monthly_manifest.json \
                  data/visuals/generation_pipeline_capacity_monthly_latest.png \
                  data/visuals/generation_pipeline_capacity_monthly_plot_data.csv \
                  data/visuals/generation_pipeline_capacity_monthly_manifest.json
          git add -A data/visuals/archive/
          if git diff --cached --quiet; then
            echo 'No monthly generation-pipeline changes to commit'
            exit 0
          fi
          git commit -m 'Automated monthly generation pipeline chart refresh'
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
