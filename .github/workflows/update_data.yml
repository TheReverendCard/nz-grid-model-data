name: Daily NZ Grid Data Refresh

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild daily-scope derived outputs even if upstream data is unchanged'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nz-grid-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-hmd:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      substantive_changed: ${{ steps.detect.outputs.substantive_changed }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check EA HMD Data
        run: python update_data.py
      - name: Capture HMD Changes
        id: detect
        shell: bash
        run: |
          mkdir -p patches
          git add -A -- data/hydro data/metadata/hmd_manifest.json data/metadata/hmd_index_sources.json data/metadata/hmd_model_series_sources.json data/metadata/hmd_infrastructure_source.json
          git diff --cached --binary -- data/hydro data/metadata/hmd_manifest.json data/metadata/hmd_index_sources.json data/metadata/hmd_model_series_sources.json data/metadata/hmd_infrastructure_source.json > patches/hmd.patch
          if [ -s patches/hmd.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if git diff --cached --quiet -- data/hydro; then echo "substantive_changed=false" >> "$GITHUB_OUTPUT"; else echo "substantive_changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: hmd-source-patch
          path: patches/hmd.patch
          if-no-files-found: error
          retention-days: 1

  check-wholesale:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      substantive_changed: ${{ steps.detect.outputs.substantive_changed }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check EA Wholesale Generation and Grid Export Data
        run: python update_wholesale.py
      - name: Capture Wholesale Changes
        id: detect
        shell: bash
        run: |
          mkdir -p patches
          git add -A -- data/wholesale/raw data/metadata/wholesale_sources.json
          git diff --cached --binary -- data/wholesale/raw data/metadata/wholesale_sources.json > patches/wholesale.patch
          if [ -s patches/wholesale.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if git diff --cached --quiet -- data/wholesale/raw; then echo "substantive_changed=false" >> "$GITHUB_OUTPUT"; else echo "substantive_changed=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: wholesale-source-patch
          path: patches/wholesale.patch
          if-no-files-found: error
          retention-days: 1

  check-reconciliation:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      substantive_changed: ${{ steps.detect.outputs.substantive_changed }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check Reconciled Demand and Injection
        run: python update_reconciliation.py
      - name: Capture Reconciliation Changes
        id: detect
        shell: bash
        run: |
          mkdir -p patches
          git add -A -- data/wholesale/model/reconciliation_monthly data/wholesale/model/reconciliation_injection_poc_monthly data/wholesale/model/reconciled_daily.csv data/wholesale/model/reconciled_injection_by_poc_2024.csv data/metadata/reconciliation_sources.json
          git diff --cached --binary -- data/wholesale/model/reconciliation_monthly data/wholesale/model/reconciliation_injection_poc_monthly data/wholesale/model/reconciled_daily.csv data/wholesale/model/reconciled_injection_by_poc_2024.csv data/metadata/reconciliation_sources.json > patches/reconciliation.patch
          if [ -s patches/reconciliation.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if git diff --cached --quiet -- data/wholesale/model/reconciliation_monthly data/wholesale/model/reconciliation_injection_poc_monthly data/wholesale/model/reconciled_daily.csv data/wholesale/model/reconciled_injection_by_poc_2024.csv; then
            echo "substantive_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "substantive_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: reconciliation-source-patch
          path: patches/reconciliation.patch
          if-no-files-found: error
          retention-days: 1

  check-distributed-generation:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      substantive_changed: ${{ steps.dg.outputs.distributed_generation_changed }}
      solar_model_inputs_changed: ${{ steps.dg.outputs.solar_model_inputs_changed }}
      battery_model_inputs_changed: ${{ steps.dg.outputs.battery_model_inputs_changed }}
      metadata_changed: ${{ steps.dg.outputs.metadata_changed }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check EA Distributed Generation Data
        id: dg
        run: python update_distributed_generation.py
      - name: Capture Distributed Generation Changes
        id: detect
        shell: bash
        run: |
          mkdir -p patches
          git add -A -- data/distributed_generation data/metadata/distributed_generation_sources.json
          git diff --cached --binary -- data/distributed_generation data/metadata/distributed_generation_sources.json > patches/distributed-generation.patch
          if [ -s patches/distributed-generation.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: distributed-generation-source-patch
          path: patches/distributed-generation.patch
          if-no-files-found: error
          retention-days: 1

  check-prices:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Check EA Final Energy Prices
        run: python update_prices.py
      - name: Capture Price Changes
        id: detect
        shell: bash
        run: |
          mkdir -p patches
          git add -A -- data/prices data/public/wholesale_prices_daily.csv data/metadata/price_sources.json
          git diff --cached --binary -- data/prices data/public/wholesale_prices_daily.csv data/metadata/price_sources.json > patches/prices.patch
          if [ -s patches/prices.patch ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: prices-source-patch
          path: patches/prices.patch
          if-no-files-found: error
          retention-days: 1

  rebuild-daily-dependents:
    needs: [check-hmd, check-wholesale, check-reconciliation, check-distributed-generation, check-prices]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Download Source Patches
        uses: actions/download-artifact@v4
        with:
          pattern: '*-source-patch'
          path: patches
          merge-multiple: true

      - name: Apply Source Patches
        shell: bash
        run: |
          shopt -s nullglob
          for patch in patches/*.patch; do
            if [ -s "$patch" ]; then
              echo "Applying $patch"
              git apply --binary "$patch"
            fi
          done

      - name: Set up Python
        if: inputs.force_rebuild == true || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true' || needs.check-reconciliation.outputs.substantive_changed == 'true' || needs.check-distributed-generation.outputs.substantive_changed == 'true' || needs.check-prices.outputs.changed == 'true'
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'

      - name: Install Model Dependencies
        if: inputs.force_rebuild == true || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true' || needs.check-reconciliation.outputs.substantive_changed == 'true' || needs.check-distributed-generation.outputs.substantive_changed == 'true'
        run: pip install requests openpyxl matplotlib scipy pandas beautifulsoup4

      - name: Normalize Hydro Data
        if: inputs.force_rebuild == true || needs.check-hmd.outputs.substantive_changed == 'true'
        run: python normalize_hydro.py

      - name: Build Hydro Storage Energy Equivalent
        if: inputs.force_rebuild == true || needs.check-hmd.outputs.substantive_changed == 'true'
        run: python build_hydro_storage_energy.py

      - name: Normalize Wholesale Data
        if: inputs.force_rebuild == true || needs.check-wholesale.outputs.substantive_changed == 'true'
        run: python normalize_wholesale.py

      - name: Diagnose Generation POC Coverage
        if: inputs.force_rebuild == true || needs.check-wholesale.outputs.substantive_changed == 'true' || needs.check-reconciliation.outputs.substantive_changed == 'true'
        run: python diagnose_generation_poc.py

      - name: Validate Wholesale Baseline
        if: inputs.force_rebuild == true || needs.check-wholesale.outputs.substantive_changed == 'true' || needs.check-reconciliation.outputs.substantive_changed == 'true'
        run: python validate_baseline.py

      - name: Normalize Distributed Generation Data
        if: inputs.force_rebuild == true || needs.check-distributed-generation.outputs.substantive_changed == 'true'
        run: python normalize_distributed_generation.py

      - name: Classify Current Solar Installations by Size
        if: inputs.force_rebuild == true || needs.check-distributed-generation.outputs.solar_model_inputs_changed == 'true'
        run: python build_solar_size_buckets.py

      - name: Build Distributed Solar Adoption Scenarios
        if: inputs.force_rebuild == true || needs.check-distributed-generation.outputs.solar_model_inputs_changed == 'true'
        run: python build_distributed_solar_scenarios.py

      - name: Apply Larger Distributed Solar Growth Guardrail
        if: inputs.force_rebuild == true || needs.check-distributed-generation.outputs.solar_model_inputs_changed == 'true'
        run: python cap_larger_distributed_solar_growth.py

      - name: Build Distributed Battery Attachment Scenarios
        if: inputs.force_rebuild == true || needs.check-distributed-generation.outputs.battery_model_inputs_changed == 'true' || needs.check-distributed-generation.outputs.solar_model_inputs_changed == 'true'
        run: python build_distributed_battery_scenarios.py

      - name: Diagnose Solar Generation Yield Candidates
        if: inputs.force_rebuild == true || needs.check-wholesale.outputs.substantive_changed == 'true'
        run: python diagnose_solar_yield.py

      - name: Estimate 2024 Behind-Meter Solar
        if: inputs.force_rebuild == true || needs.check-wholesale.outputs.substantive_changed == 'true' || needs.check-distributed-generation.outputs.substantive_changed == 'true'
        run: python estimate_btm_solar_2024.py

      - name: Build Calibrated 2024 Baseline
        if: inputs.force_rebuild == true || needs.check-wholesale.outputs.substantive_changed == 'true' || needs.check-reconciliation.outputs.substantive_changed == 'true' || needs.check-distributed-generation.outputs.substantive_changed == 'true'
        run: python build_baseline_2024.py

      - name: Build Calibrated Future Demand Scenarios
        if: inputs.force_rebuild == true || needs.check-wholesale.outputs.substantive_changed == 'true' || needs.check-reconciliation.outputs.substantive_changed == 'true' || needs.check-distributed-generation.outputs.substantive_changed == 'true'
        run: python build_future_demand_scenarios.py

      - name: Build 2030 Replay Inputs
        if: inputs.force_rebuild == true || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true' || needs.check-reconciliation.outputs.substantive_changed == 'true' || needs.check-distributed-generation.outputs.substantive_changed == 'true'
        run: python build_replay_inputs.py

      - name: Compare Hydro Inflow and Solar Seasonality
        if: inputs.force_rebuild == true || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true'
        run: python build_hydro_solar_seasonality.py

      - name: Compare Distributed Solar with SOSA Winter Energy
        if: inputs.force_rebuild == true || needs.check-distributed-generation.outputs.solar_model_inputs_changed == 'true' || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true'
        run: python build_distributed_solar_winter_energy.py

      - name: Compare Distributed Batteries with SOSA NI Capacity
        if: inputs.force_rebuild == true || needs.check-distributed-generation.outputs.battery_model_inputs_changed == 'true' || needs.check-distributed-generation.outputs.solar_model_inputs_changed == 'true'
        run: python build_distributed_battery_sosa_ni_capacity.py

      - name: Build SOSA Distributed Margin Comparison
        if: inputs.force_rebuild == true || needs.check-distributed-generation.outputs.battery_model_inputs_changed == 'true' || needs.check-distributed-generation.outputs.solar_model_inputs_changed == 'true' || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true'
        run: python build_sosa_distributed_comparison.py

      - name: Build Hydro Winter Energy Equivalence View
        if: inputs.force_rebuild == true || needs.check-distributed-generation.outputs.solar_model_inputs_changed == 'true' || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true'
        run: python build_hydro_energy_equivalence.py

      - name: Render Observed 2024 Hydro Price Stripes
        if: inputs.force_rebuild == true || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true'
        run: python build_observed_2024_hydro_price_stripes.py

      - name: Build Hydro Trough Counterfactual
        if: inputs.force_rebuild == true || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true' || needs.check-distributed-generation.outputs.solar_model_inputs_changed == 'true'
        run: python build_hydro_trough_counterfactual.py

      - name: Render Observed 2024 WAEERC Risk Zones
        if: inputs.force_rebuild == true || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true'
        continue-on-error: true
        run: python build_observed_2024_erc_zones.py

      - name: Build Public Observed Data Views
        if: inputs.force_rebuild == true || needs.check-hmd.outputs.substantive_changed == 'true' || needs.check-wholesale.outputs.substantive_changed == 'true' || needs.check-distributed-generation.outputs.substantive_changed == 'true' || needs.check-prices.outputs.changed == 'true'
        run: python build_public_views.py

      - name: Audit Run Decisions
        if: always()
        shell: bash
        run: |
          {
            echo "## Daily refresh summary"
            echo ""
            echo "| Source | Versioned change | Substantive model-input change |"
            echo "|---|---:|---:|"
            echo "| HMD | ${{ needs.check-hmd.outputs.changed }} | ${{ needs.check-hmd.outputs.substantive_changed }} |"
            echo "| Wholesale | ${{ needs.check-wholesale.outputs.changed }} | ${{ needs.check-wholesale.outputs.substantive_changed }} |"
            echo "| Reconciliation | ${{ needs.check-reconciliation.outputs.changed }} | ${{ needs.check-reconciliation.outputs.substantive_changed }} |"
            echo "| Distributed generation | ${{ needs.check-distributed-generation.outputs.changed }} | ${{ needs.check-distributed-generation.outputs.substantive_changed }} |"
            echo "| Wholesale prices | ${{ needs.check-prices.outputs.changed }} | public-view only |"
            echo ""
            echo "Solar model inputs changed: ${{ needs.check-distributed-generation.outputs.solar_model_inputs_changed }}"
            echo ""
            echo "Battery model inputs changed: ${{ needs.check-distributed-generation.outputs.battery_model_inputs_changed }}"
            echo ""
            echo "Force rebuild: ${{ inputs.force_rebuild }}"
            echo ""
            echo "### Files changed before commit"
            git status --short data/ || true
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit and Push Changes
        shell: bash
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Files committed" >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --name-only | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          git commit -m "Automated NZ grid daily refresh"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
